name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Type check
        working-directory: ./
        run: npm run type-check

      - name: Lint code
        working-directory: ./
        run: npm run lint

      - name: Check formatting
        working-directory: ./
        run: npm run format:check

      - name: Build project
        working-directory: ./
        run: npm run build

      - name: Run tests
        working-directory: ./
        run: npm run test

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: .//package-lock.json

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Audit packages
        working-directory: ./
        run: npm audit --audit-level=moderate
        continue-on-error: true

  lint-and-test-summary:
    needs: [ci, security]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check all checks passed
        run: |
          if [ "${{ needs.ci.result }}" = "failure" ] || [ "${{ needs.security.result }}" = "failure" ]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed"
